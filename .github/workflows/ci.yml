name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Smoke test native process snapshot
        shell: bash
        run: '"$(command -v node)" scripts/smoke-process-snapshot.js'

      - name: Smoke test Alpine /proc fallback
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            node:20-alpine /usr/local/bin/node scripts/smoke-process-snapshot.js --proc-fallback

  # Rulesets require the exact context name "build-and-test"; matrix jobs
  # report as "build-and-test (ubuntu-latest)" and never satisfy that check.
  build-and-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success
        run: test "${{ needs.test.result }}" = "success"
